<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEEK Pins Protocol</title>
<meta name="description" content="Step-by-step protocol for PEEK Pins (Dynamic Abutment Solutions): pin selection, DAS Reference Scanbody, seating check, scan, CAPS, alignment in CAD, OP Scanbody.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#363844;--black:#060509;--black2:#0A0909;--foot:#252525;
  --g1:#4B4B4B;--g2:#6F6F6F;--g3:#7A7A7A;--g4:#B9B9B9;--line:#D7D7D7;--panel:#FAFAFA;--render:#F7F7F7;--white:#FFFFFF;
  --blue:#0085C1;--teal:#009F97;
  --grad:linear-gradient(119deg,#0085C1 0%,#008AB8 31%,#0098A2 80%,#009F97 100%);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--white);font-size:16px;line-height:1.45;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 40px}
@media (max-width:700px){.wrap{padding:0 16px}.top span{display:none}.hero .wrap{padding-top:44px;padding-bottom:40px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--white)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.top svg{width:139px;height:40px;flex:none}
.top span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--g2);text-align:right}

/* hero */
.hero{background:var(--black);color:#FFFEFE;position:relative;overflow:hidden}
.hero .wrap{padding-top:64px;padding-bottom:56px;position:relative}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--g4);margin-bottom:22px}
.eyebrow:before{content:"";width:28px;height:2px;background:var(--grad);flex:none}
.hero h1{font-size:clamp(42px,7vw,80px);font-weight:400;line-height:.95;letter-spacing:-.02em;max-width:900px}
.hero p.lead{font-size:clamp(17px,2vw,20px);font-weight:300;color:var(--line);max-width:760px;margin-top:22px;letter-spacing:-.01em}

/* player */
.player{padding:40px 0 24px;background:var(--white)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.chip{flex:none;font:400 13px/1 Inter,Arial,sans-serif;text-transform:uppercase;letter-spacing:.03em;color:var(--g3);background:transparent;border:1px solid var(--line);border-radius:30px;padding:10px 16px;cursor:pointer;transition:color .3s,border-color .3s,background .3s}
.chip b{font-weight:400;color:var(--g4);margin-right:6px;transition:color .3s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.done{color:var(--ink)}
.chip[aria-current="step"]{background:var(--black);border-color:var(--black);color:#FFFEFE}
.chip[aria-current="step"] b{color:var(--g4)}
.progress{height:2px;background:var(--line);margin:6px 0 24px;position:relative}
.progress span{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--grad);transition:width .6s var(--ease)}

.grid{display:grid;gap:28px;align-items:start}
@media (min-width:980px){.grid{grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:40px}}

.stage{position:relative;aspect-ratio:1024/819;background:var(--render);overflow:hidden;border:1px solid var(--line)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}
.scene.active{opacity:1;visibility:visible;transition:opacity .5s ease}
.scene.reset,.scene.reset *{transition:none!important;animation:none!important}
.scene>svg,.scene>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene img{object-fit:contain}
.cap{position:absolute;left:3%;top:3.5%;font-size:clamp(10px,1.3vw,12px);text-transform:uppercase;letter-spacing:.06em;color:var(--g2);display:flex;align-items:center;gap:8px;z-index:3}
.cap:before{content:"";width:16px;height:2px;background:var(--grad)}
.badge{position:absolute;left:3%;bottom:4%;z-index:4;background:var(--black);color:#FFFEFE;font-size:clamp(10px,1.4vw,13px);text-transform:uppercase;letter-spacing:.04em;padding:8px 14px;border-radius:30px;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .6s var(--ease);max-width:70%}
.inset{position:absolute;right:3%;bottom:4%;width:40%;aspect-ratio:1024/819;background:var(--render);border:1px solid var(--line);opacity:0;transform:translateY(16px) scale(.96);transition:opacity .6s,transform .8s var(--ease);z-index:3}
.inset img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.inset small{position:absolute;left:8px;bottom:6px;font-size:clamp(9px,1.1vw,11px);text-transform:uppercase;letter-spacing:.05em;color:var(--g2)}
.inset.br{width:38%;bottom:14%}
.inset.mu-inset{aspect-ratio:200/350;width:14%;right:1.5%;bottom:16%;opacity:1;transform:none}
.mu-inset svg{position:absolute;left:8%;top:3%;width:84%;height:auto}
.mu-inset small{left:3px;right:3px;bottom:4px;text-align:center;font-size:clamp(7px,.95vw,10px);line-height:1.15}
.timer{height:2px;background:transparent;margin-top:6px;overflow:hidden}
.timer span{display:block;height:100%;width:0;background:var(--ink)}

/* panel */
.panel{min-height:200px}
.pin{transition:opacity .45s ease,transform .55s var(--ease)}
.pin.out{opacity:0;transform:translateY(12px)}
.pnum{font-size:16px;font-weight:300;color:var(--g3);letter-spacing:-.02em;margin-bottom:10px}
.panel h2{font-size:clamp(30px,3.4vw,44px);font-weight:400;line-height:.95;letter-spacing:-.02em;margin-bottom:14px}
.panel p.lead{font-size:17px;font-weight:300;color:var(--g1);margin-bottom:22px}
.panel h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--g3);padding-bottom:8px;border-bottom:2px solid var(--ink);margin:18px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel ul,.panel ol{list-style:none}
.panel li{padding:10px 0;border-bottom:1px solid var(--line);font-weight:300;font-size:15px}
.panel ol{counter-reset:k}
.panel ol li{counter-increment:k;display:grid;grid-template-columns:34px 1fr}
.panel ol li:before{content:counter(k,decimal-leading-zero)".";color:var(--blue);font-weight:400}
.panel ul.do li{display:grid;grid-template-columns:18px 1fr}
.panel ul.do li:before{content:"";width:8px;height:8px;margin-top:7px;background:var(--ink)}
.panel ul.warn li{display:grid;grid-template-columns:18px 1fr}
.panel ul.warn li:before{content:"";width:8px;height:8px;margin-top:7px;border:1px solid var(--g2)}
.panel ul.imp li{display:grid;grid-template-columns:22px 1fr;font-weight:400;background:var(--panel);border-left:3px solid var(--blue);padding-left:12px;padding-right:10px}
.panel ul.imp li:before{content:"!";color:var(--blue);font-weight:600}
.panel b{font-weight:600}

/* checklist */
.cl h3{margin-top:14px}
.cl label{display:grid;grid-template-columns:28px 1fr;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);font-weight:300;font-size:15px;cursor:pointer}
.cl input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--ink);margin-top:2px;display:grid;place-content:center;cursor:pointer;background:#fff}
.cl input:checked{background:var(--black);border-color:var(--black)}
.cl input:checked:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.cl input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cl input:checked+span{color:var(--g3);text-decoration:line-through;text-decoration-color:var(--g4)}
.clbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;font-size:14px;color:var(--g2)}

/* controls */
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.controls .grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:400 16px/1.2 Inter,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;padding:16px 36px;border-radius:30px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .3s,color .3s,border-color .3s,opacity .3s}
.btn:hover{background:var(--ink);color:#fff}
.btn.dark{background:var(--black);border-color:var(--black);color:#FFFEFE}
.btn.dark:hover{background:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default;background:transparent;color:var(--ink)}
.btn.dark:disabled{background:var(--black);color:#FFFEFE}
.btn.small{font-size:13px;padding:10px 18px}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.count{font-size:15px;font-weight:300;color:var(--g2);min-width:64px;text-align:center}
.hint{font-size:13px;color:var(--g3)}
.btn:focus-visible,.chip:focus-visible,.replay:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@media (max-width:700px){
  .btn{font-size:14px;padding:12px 20px}
  .hint{display:none}
  .controls{justify-content:center}
}

.note{font-size:14px;font-weight:300;color:var(--g2);margin-top:14px}

footer{background:var(--foot);color:#CECECE;padding:44px 0 36px;font-size:14px}
footer .wrap{display:grid;gap:24px}
@media (min-width:860px){footer .wrap{grid-template-columns:auto 1fr;align-items:start}}
footer .contact{display:flex;flex-wrap:wrap;gap:8px 24px}
footer .contact a{color:#FFFEFE;text-decoration:none}
footer .contact a:hover{text-decoration:underline}
footer .legal{grid-column:1/-1;border-top:1px solid var(--g1);padding-top:16px;color:var(--g4);font-size:13px}


/* ---------- scene 0: system ---------- */
.s0 .img1{opacity:0;transform:scale(.84) translateX(3%);transition:opacity 1.1s ease,transform 1.6s var(--ease)}
.s0.ph1 .img1{opacity:1;transform:scale(.76)}
.s0.ph4 .img1{opacity:0;transform:scale(.7)}
.s0 .img2{opacity:0;transform:scale(1.05);transition:opacity 1.1s ease,transform 1.8s var(--ease)}
.s0.ph4 .img2{opacity:1;transform:none}
.ann .ln{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s var(--ease)}
.ann .ln.w{stroke:#FFFEFE}
.ann .dt{opacity:0;transition:opacity .4s}
.ann text{font-family:Inter,Arial,sans-serif;fill:var(--ink);font-size:30px;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .7s var(--ease)}
.ann text.sm{font-size:24px;fill:var(--g2)}
.ann text.w{fill:#FFFEFE}
.s0.ph2 .a1 .ln{stroke-dashoffset:0}
.s0.ph2 .a1 .dt,.s0.ph3 .a1 text{opacity:1;transform:none}
.s0.ph4 .a1{opacity:0;transition:opacity .5s}
.s0.ph4 .a2 .ln{stroke-dashoffset:0;transition-delay:.6s}
.s0.ph4 .a2 .dt,.s0.ph4 .a2 text{opacity:1;transform:none;transition-delay:.9s}

/* ---------- side view (s1, s4, s7, s10) ---------- */
.side text{font-family:Inter,Arial,sans-serif}
.side .t-s{font-size:15px;fill:var(--g2)}
.side .t-m{font-size:18px;fill:var(--ink)}
.side .t-x{font-size:14px;fill:var(--g2)}
.side .p-pin,.side .p-sb,.side .p-mu,.side .p-imp,.side .p-caps,.side .p-ant,.side .p-drv,.side .p-tq,.side .p-chk,.side .lbls{transition:transform 1.1s var(--ease),opacity .6s ease}
.side .p-caps,.side .p-ant,.side .p-drv,.side .p-tq,.side .p-chk,.side .lbls{opacity:0}
.side .p-drv{transform:translateY(-230px)}
.side .p-caps{transform:translateY(-90px)}
.side .p-ant{transform:translateY(-60px)}
.side .arc{stroke-dasharray:5 4;animation:dash .9s linear infinite;opacity:0;transition:opacity .3s}
@keyframes dash{to{stroke-dashoffset:-18}}
.side .knurl{animation:knurl .55s linear infinite paused}
@keyframes knurl{to{transform:translateX(20.8px)}}
.side .thr{animation:thr .5s linear infinite paused}
@keyframes thr{to{transform:translateY(11.56px)}}
.side .p-capsl{opacity:0;transition:opacity .6s}
.side .ribs{animation:ribs .45s linear infinite paused}
@keyframes ribs{to{transform:translateX(9px)}}

/* s1 explode */
.s1 .p-caps,.s1 .p-ant,.s1 .p-tq,.s1 .p-drv{display:none}
.s1.ph1 .p-sb{transform:translateY(-44px)}
.s1.ph1 .p-pin{transform:translate(70px,-44px)}
.s1.ph2 .lbls{opacity:1}
.s1 .lbls .ln{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s var(--ease)}
.s1.ph2 .lbls .ln{stroke-dashoffset:0}
.s1 .lbls g{opacity:0;transition:opacity .5s}
.s1.ph2 .lbls g{opacity:1}
.s1.ph2 .lbls g:nth-child(2){transition-delay:.2s}
.s1.ph2 .lbls g:nth-child(3){transition-delay:.4s}
.s1.ph2 .lbls g:nth-child(4){transition-delay:.6s}

/* s3 pin wkrecany poza ustami */
.pm text{font-family:Inter,Arial,sans-serif}
.s3>svg.pm{transform:translateY(5%) scale(1.12)}
.pm .pr,.pm .pl{opacity:0;transition:transform .9s var(--ease),opacity .4s}
.pm .pr{transform:translateX(150px)}
.pm .pl{transform:translateX(-150px)}
.s3.ph1 .pm .pr{transform:translateX(44px);opacity:1}
.s3.ph2 .pm .pr{transform:none;transition:transform 2.3s linear,opacity .4s}
.s3.ph3 .pm .pl{transform:translateX(-44px);opacity:1}
.s3.ph4 .pm .pl{transform:none;transition:transform 2.3s linear,opacity .4s}
.pm .rot{opacity:0;transition:opacity .3s;stroke-dasharray:7 5;animation:dash .6s linear infinite}
.s3[data-ph="2"] .pm .pr .rot,.s3[data-ph="4"] .pm .pl .rot{opacity:1}
.pm .ribs{animation:ribs .4s linear infinite paused}
.pm .fac{animation:fac .45s linear infinite paused}
@keyframes fac{to{transform:translateY(21px)}}
.s3[data-ph="2"] .pm .pr .ribs,.s3[data-ph="4"] .pm .pl .fac{animation-play-state:running}
.pm .stop{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.s3[data-ph="3"] .pm .stopR,.s3[data-ph="5"] .pm .stopL{animation:pop 1s ease-out 1}
@keyframes pop{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
.pm .lb{opacity:0;transition:opacity .5s}
.s3.ph1 .pm .lbR,.s3.ph3 .pm .lbL,.s3.ph1 .pm .lbS{opacity:1}
.pm .hand{opacity:0;transition:opacity .3s}
.s3[data-ph="2"] .pm .pr .hand,.s3[data-ph="4"] .pm .pl .hand{opacity:1}
.s3.ph5 .badge{opacity:1;transform:none}

/* s4 scanbody z pinem na multi-unit */
.s4 .p-caps,.s4 .p-ant,.s4 .lbls{display:none}
.s4 .p-sb,.s4 .p-pin{transform:translateY(-190px);opacity:0}
.s4.ph1 .p-sb,.s4.ph1 .p-pin{transform:none;opacity:1}
.s4.ph2 .p-drv{transform:none;opacity:1}
.s4 .arc-cw{opacity:1}
.s4.ph3 .p-tq{opacity:1}
.s4.ph4 .p-chk{opacity:1}
.s4.ph4 .p-drv{transform:translateY(-230px);opacity:0}
.side .p-mir{opacity:0;transform:translate(-90px,-50px);transition:transform 1.2s var(--ease),opacity .5s}
.s4.ph4 .p-mir{opacity:1;transform:none}
.side .p-rtg{opacity:0;transition:opacity .4s}
.s4.ph5 .p-rtg{opacity:1}
.s4[data-ph="5"] .p-rtg .fl{animation:flash 1.1s ease-out 1}
@keyframes flash{0%{fill-opacity:.75}100%{fill-opacity:0}}
.s4.ph3 .p-tq rect{animation:tq 1s ease-out 1}
@keyframes tq{0%{transform:scale(1.25)}100%{transform:none}}
.side .p-tq rect{transform-box:fill-box;transform-origin:50% 50%}

/* s7 caps */
.s7 .p-drv,.s7 .p-tq,.s7 .lbls{display:none}
.s7.ph1 .p-caps{transform:none;opacity:1;transition:transform 2.4s linear,opacity .4s}
.s7.ph1 .p-capsl{opacity:1;transition-delay:1.2s}
.s7[data-ph="1"] .knurl,.s7[data-ph="1"] .thr{animation-play-state:running}
.s7.ph2 .p-ant{transform:none;opacity:1;transition-duration:1.2s,.6s}
.s7.ph3 .badge{opacity:1;transform:none}

/* s10 removal */
.s10 .p-caps,.s10 .p-ant,.s10 .p-tq,.s10 .lbls{display:none}
.s10.ph1 .p-drv{transform:none;opacity:1}
.s10 .arc-ccw{opacity:1}
.s10.ph2 .p-sb,.s10.ph2 .p-pin,.s10.ph2 .p-drv{transform:translate(20px,-260px);opacity:0;transition-duration:1.4s,.9s}
.s10.ph3 .badge{opacity:1;transform:none}

/* ---------- s2 types ---------- */
.types text{font-family:Inter,Arial,sans-serif}
.types .row{opacity:0;transform:translateX(-14px);transition:opacity .5s,transform .7s var(--ease);transition-delay:calc(var(--i)*.22s)}
.s2.ph1 .types .row{opacity:1;transform:none}
.types .hd{opacity:0;transition:opacity .6s}
.s2.ph2 .types .hd{opacity:1}
.s2 .types{transition:opacity .8s}
.s2.ph3 .types{opacity:0}
.s2 .img2{opacity:0;transform:scale(1.04);transition:opacity 1s ease,transform 1.6s var(--ease)}
.s2.ph3 .img2{opacity:1;transform:none}
.s2 .credit{position:absolute;right:3%;bottom:3.5%;font-size:clamp(9px,1.1vw,11px);text-transform:uppercase;letter-spacing:.05em;color:var(--g2);opacity:0;transition:opacity .6s;z-index:3}
.s2.ph3 .credit{opacity:1}
.s2.ph3 .cap{opacity:0}
.cap{transition:opacity .4s}

/* ---------- arch scenes (s3, s5, s6) ---------- */
.arch text{font-family:Inter,Arial,sans-serif}
.arch .lab{font-size:15px;fill:var(--ink)}
.arch .lab.sm{font-size:13px;fill:var(--g2)}
.arch .dot{opacity:0;transition:opacity .35s ease}
.arch .dot.on{opacity:1}
.s6.ph1 .badge{opacity:1;transform:none}
.s5 .pinw{transform:rotate(var(--r0));transition:transform 1.9s var(--ease);transition-delay:calc(var(--j)*.28s)}
.s5.ph1 .pinw{transform:none}
.s5 .gap,.s5 .lab{opacity:0;transition:opacity .7s}
.s5.ph2 .gap,.s5.ph2 .lab{opacity:1}
.s5.ph2 .gap{animation:gapp 1.6s ease-in-out infinite}
@keyframes gapp{0%,100%{stroke-width:2.2}50%{stroke-width:4.2}}
.s5 .cord{opacity:0;transition:opacity .5s}
.s5.ph3 .cord{opacity:1;animation:cord 1.5s ease-in-out infinite alternate}
@keyframes cord{from{transform:translate(calc(var(--nx)*-11px),calc(var(--ny)*-11px))}to{transform:translate(calc(var(--nx)*11px),calc(var(--ny)*11px))}}
.s5 .mag{opacity:0;transform:scale(.7);transform-box:fill-box;transform-origin:50% 50%;transition:opacity .6s,transform .8s var(--ease)}
.s5.ph3 .mag{opacity:1;transform:none}
.s5.ph3 .mag .braid{animation:braid .7s linear infinite}
@keyframes braid{to{stroke-dashoffset:-18}}
.s6 .badge{bottom:auto;top:3.5%;max-width:52%}
.s6 .beam{animation:beam .55s ease-in-out infinite alternate}
@keyframes beam{from{opacity:.35}to{opacity:.9}}
.s6.ph1 .beam{animation:none;opacity:.2}
.s6 .win{animation:beam .3s linear infinite alternate}
.s6.ph1 .win{animation:none}
.s8.ph3 .lib rect{animation:fit 1.3s ease-out 1}
@keyframes fit{0%{stroke-width:8}100%{stroke-width:2.8}}

/* ---------- s8 CAD ---------- */
.cad text{font-family:Inter,Arial,sans-serif}
.cad .lib{transform-box:fill-box;transform-origin:50% 50%;transform:translate(46px,-52px) rotate(-9deg);opacity:0;transition:transform 2s var(--ease),opacity .6s}
.s8.ph1 .lib{opacity:1}
.s8.ph2 .lib{transform:none}
.cad .zone{opacity:0;transition:opacity .6s}
.s8.ph3 .zone{opacity:1}
.s8.ph3 .badge{opacity:1;transform:none}
.s8 .badge{bottom:auto;top:9.5%}
.leg{position:absolute;right:3%;top:3.5%;z-index:3;display:grid;gap:6px;font-size:clamp(10px,1.3vw,12px);color:var(--g1);text-transform:uppercase;letter-spacing:.04em}
.leg span{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.leg i{display:inline-block;width:18px;height:2px;background:var(--grad)}
.leg i.d{height:6px;width:6px;border-radius:50%;background:var(--g2)}

/* ---------- s9 OP scanbody ---------- */
.s9 .img1{opacity:0;transform:scale(1.06);transition:opacity 1s ease,transform 1.6s var(--ease)}
.s9.ph1 .img1{opacity:1;transform:scale(.78)}
.s9.ph2 .a1 .ln{stroke-dashoffset:0}
.s9.ph2 .a1 .dt,.s9.ph3 .a1 text{opacity:1;transform:none}

/* ---------- s11 errors ---------- */
.errs{position:absolute;inset:12% 3% 4%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:8px}
.err{background:var(--white);border:1px solid var(--line);border-top:2px solid var(--ink);padding:clamp(6px,1.4vw,14px);display:flex;flex-direction:column;justify-content:space-between;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .6s var(--ease);transition-delay:calc(var(--i)*.14s);min-height:0;overflow:hidden}
.s11.ph1 .err{opacity:1;transform:none}
.err b{font-weight:400;font-size:clamp(12px,1.7vw,17px);line-height:1.1;letter-spacing:-.01em}
.err span{font-size:clamp(9.5px,1.2vw,12px);color:var(--g2);font-weight:300}
.err em{font-style:normal;font-size:clamp(9px,1.1vw,11px);color:var(--blue);text-transform:uppercase;letter-spacing:.04em}

/* ---------- s12 checklist ring ---------- */
.ring{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
.ring svg{width:46%;height:auto;overflow:visible}
.ring .pr{transition:stroke-dashoffset .8s var(--ease)}
.ring text{font-family:Inter,Arial,sans-serif}
.s12 .bg{opacity:0;transition:opacity 1s}
.s12.ph1 .bg{opacity:.22}
.s12 .ring{opacity:0;transform:scale(.94);transition:opacity .6s,transform .8s var(--ease)}
.s12.ph1 .ring{opacity:1;transform:none}

.top .brandless{display:inline!important;font-size:13px;font-weight:600;color:var(--ink);text-align:left;text-transform:none;letter-spacing:0}
.tag{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);border:1px solid var(--blue);border-radius:30px;padding:2px 8px;margin-left:6px;vertical-align:1px;white-space:nowrap}

@media (max-width:600px){
  .s5 .inset{width:44%}
  .s8 .badge{display:none}
  .s1 .cap{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
.rm *,.rm *:before,.rm *:after{animation:none!important;transition:none!important}
@media print{.controls,.chips,.replay,.toggle,.timer{display:none}}
</style>
</head>

function dirTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;}
function tang(deg,sg){var a=deg*Math.PI/180;return Math.atan2(-Math.cos(a)*sg,-Math.sin(a)*sg)*180/Math.PI;}
/* przykładowy układ pinów: każdy pin kieruje się do sąsiedniego scanbody, skrajne wzdłuż wyrostka dystalnie */
var PINS=[
 {s:0,a:tang(IDEG[0],1),len:6,type:'B'},
 {s:0,a:dirTo(IMPL[0],IMPL[1]),len:9,type:'C'},
 {s:1,a:dirTo(IMPL[1],IMPL[0]),len:6,type:'C'},
 {s:1,a:dirTo(IMPL[1],IMPL[2]),len:9,type:'A'},
 {s:2,a:dirTo(IMPL[2],IMPL[1]),len:9,type:'A'},
 {s:2,a:dirTo(IMPL[2],IMPL[3]),len:6,type:'C'},
 {s:3,a:dirTo(IMPL[3],IMPL[2]),len:9,type:'C'},
 {s:3,a:tang(IDEG[3],-1),len:6,type:'B'}
];
/* ścieżka skanu z pinami: start dystalnie na wyrostku, od scanbody do scanbody wzdłuż pinów, koniec dystalnie po drugiej stronie */
function pinsPath(){
  var pts=[],i,k;
  for(i=0;i<=30;i++)pts.push(polar(215-(215-IDEG[0])*i/30,RR));
  for(k=0;k<IMPL.length-1;k++){var a=IMPL[k],b=IMPL[k+1];for(i=1;i<=60;i++){pts.push([a.x+(b.x-a.x)*i/60,a.y+(b.y-a.y)*i/60]);}}
  for(i=1;i<=30;i++)pts.push(polar(IDEG[3]-(IDEG[3]+35)*i/30,RR));
  return ptsSampler(pts);
}
var PATHS={c:cl,p:pinsPath()};
PATHS.p.win=0.03;
function rot(x,y,deg){var r=deg*Math.PI/180;return [x*Math.cos(r)-y*Math.sin(r), x*Math.sin(r)+y*Math.cos(r)];}
function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var GRAD=function(id){return '<linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="480"><stop offset="0" stop-color="#0085C1"/><stop offset=".31" stop-color="#008AB8"/><stop offset=".8" stop-color="#0098A2"/><stop offset="1" stop-color="#009F97"/></linearGradient>';};
/* głowica skanera wewnątrzustnego z góry: okienko skanowania w (0,0), kierunek ruchu +x, rękojeść z tyłu; półprzezroczysta */
function scannerTop(g){
  return '<g class="ios" opacity=".5">'+
    '<path d="M-132 -11L-34 -13Q-22 -17 -12 -17H16Q28 -17 28 -5V5Q28 17 16 17H-12Q-22 17 -34 13L-132 11Q-140 11 -140 0Q-140 -11 -132 -11Z" fill="#4B4B4B" stroke="#363844" stroke-width="1"/>'+
    '<line x1="-118" y1="0" x2="-52" y2="0" stroke="#B9B9B9" stroke-width="1.2" stroke-linecap="round"/>'+
    '<rect class="win" x="-11" y="-9" width="22" height="18" rx="3" fill="url(#'+g+')" fill-opacity=".8" stroke="#FFFEFE" stroke-opacity=".8" stroke-width="1"/></g>'+
    '<circle r="2.4" fill="#060509"/>';
}
function headPose(P,p){
  var w=P.win||0.006,q=P.at(p),a=P.at(Math.max(0,p-w)),b=P.at(Math.min(1,p+w));
  return {x:q[0],y:q[1],a:Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI};
}
function headTf(P,p){var o=headPose(P,p);return 'translate('+f1(o.x)+' '+f1(o.y)+') rotate('+f1(o.a)+')';}

function pinTop(len,type){ /* pin z góry, oś scanbody w (0,0), pin wzdłuż +x */
  var x0=SBR,L=len*MM,h='',d='',x;
  h+='<rect x="'+f1(x0-3)+'" y="-4.5" width="9" height="9" fill="#B9B9B9"/>';
  h+='<path d="M'+f1(x0+4)+' '+f1(-PW*.6)+'L'+f1(x0+9)+' '+f1(-PW)+'H'+f1(x0+L)+'V'+f1(PW)+'H'+f1(x0+9)+'L'+f1(x0+4)+' '+f1(PW*.6)+'Z" fill="#FAFAFA" stroke="#363844" stroke-width="1.3" stroke-linejoin="round"/>';
  if(type==='A'){h+='<path d="M'+f1(x0+10)+' -4.6H'+f1(x0+L-1)+'M'+f1(x0+10)+' 4.6H'+f1(x0+L-1)+'" stroke="#B9B9B9" stroke-width="1" fill="none"/>';}
  else{var st=type==='B'?8:4.6;for(x=x0+14;x<x0+L-2;x+=st){d+='M'+f1(x)+' '+f1(-PW+1)+'V'+f1(PW-1);}h+='<path d="'+d+'" stroke="#9A9A9A" stroke-width="'+(type==='B'?1.6:1)+'" fill="none"/>';}
  return h;
}
function sbTop(p){
  return '<circle cx="'+f1(p.x)+'" cy="'+f1(p.y)+'" r="'+SBR+'" fill="#4B4B4B" stroke="#FAFAFA" stroke-width="2"/>'+
         '<circle cx="'+f1(p.x)+'" cy="'+f1(p.y)+'" r="8.4" fill="#252525" stroke="#7A7A7A" stroke-width=".8"/>';
}

function archSVG(k, opts){
  var g='g'+k, h='', P0=PATHS[opts.path||'c'];

     '<radialGradient id="mug'+k+'" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#FAFAFA"/><stop offset=".45" stop-color="#B9B9B9"/><stop offset="1" stop-color="#6F6F6F"/></radialGradient>'+
     '<pattern id="mesh'+k+'" width="22" height="19" patternUnits="userSpaceOnUse"><path d="M0 0H22M0 0L11 19L22 0M0 19H22" fill="none" stroke="#9A9A9A" stroke-width=".7"/></pattern>'+
     '<radialGradient id="beam'+k+'"><stop offset="0" stop-color="#009F97" stop-opacity=".55"/><stop offset=".6" stop-color="#0085C1" stop-opacity=".22"/><stop offset="1" stop-color="#0085C1" stop-opacity="0"/></radialGradient>'+
     '<mask id="mk'+k+'" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="480"><rect width="600" height="480" fill="#000"/><path class="maskp" d="'+P0.d+'" fill="none" stroke="#fff" stroke-width="92" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></mask></defs>';
  h+='<path d="'+cl.d+' Z" fill="#EFEFEF"/>';
  h+='<path d="'+cl.d+'" fill="none" stroke="#B9B9B9" stroke-width="80" stroke-linecap="round"/>';
  h+='<path d="'+cl.d+'" fill="none" stroke="#E4E4E4" stroke-width="77" stroke-linecap="round"/>';
  if(opts.mesh){h+='<path d="'+cl.d+'" fill="none" stroke="url(#mesh'+k+')" stroke-width="77" stroke-linecap="round" mask="url(#mk'+k+')"/>';}
  if(opts.scan&&!opts.cloud){h+='<path class="trail" d="'+P0.d+'" fill="none" stroke="url(#'+g+')" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>';}
  if(opts.pins){
    var R0=[30,-26,26,-30];
    h+='<g class="pins">';
    PINS.forEach(function(pn,i){var p=IMPL[pn.s];h+='<g transform="translate('+f1(p.x)+' '+f1(p.y)+') rotate('+f1(pn.a)+')"><g class="pinw" style="--j:'+pn.s+';--r0:'+R0[pn.s]+'deg">'+pinTop(pn.len,pn.type)+'</g></g>';});
    h+='</g>';
  }
  if(opts.sb){IMPL.forEach(function(p){h+=sbTop(p);});}
  if(opts.gaps){
    for(var q=0;q<IMPL.length-1;q++){
      var a=IMPL[q],b=IMPL[q+1],D=Math.hypot(b.x-a.x,b.y-a.y),ux=(b.x-a.x)/D,uy=(b.y-a.y)/D;
      var ta=SBR+PINS[2*q+1].len*MM, tb=SBR+PINS[2*q+2].len*MM, m=(ta+(D-tb))/2;
      var gx=a.x+ux*m, gy=a.y+uy*m;
      h+='<circle class="gap" cx="'+f1(gx)+'" cy="'+f1(gy)+'" r="12" fill="none" stroke="url(#'+g+')" stroke-width="2.2"/>';
      /* nitka retrakcyjna przechodząca przez szczelinę, prostopadle do pinów */
      h+='<line class="cord" style="--nx:'+f1(-uy)+';--ny:'+f1(ux)+'" x1="'+f1(gx+uy*24)+'" y1="'+f1(gy-ux*24)+'" x2="'+f1(gx-uy*24)+'" y2="'+f1(gy+ux*24)+'" stroke="#0085C1" stroke-width="3.4" stroke-linecap="round"/>';
    }
    /* lupa: szczelina między końcami pinów w powiększeniu ok. 4x (1 mm = 32 j.), szczelina ok. 0,8 mm */
    h+='<g class="mag"><path d="M300 202V160" stroke="#363844" stroke-width="1.4"/><g transform="translate(300 262) scale(.82) translate(-300 -262)">'+
       '<clipPath id="mgc'+k+'"><circle cx="300" cy="262" r="72"/></clipPath>'+
       '<circle cx="300" cy="262" r="74" fill="#FFFFFF" stroke="#363844" stroke-width="2"/>'+
       '<g clip-path="url(#mgc'+k+')">'+
         '<rect x="216" y="217" width="71.2" height="90" fill="#FAFAFA" stroke="#363844" stroke-width="1.6"/><path d="M216 247H287M216 277H287" stroke="#B9B9B9" stroke-width="1.2"/>'+
         '<rect x="312.8" y="217" width="71.2" height="90" fill="#FAFAFA" stroke="#363844" stroke-width="1.6"/><path d="M313 247H384M313 277H384" stroke="#B9B9B9" stroke-width="1.2"/>'+

       '</g></g>'+
       '<text x="300" y="344" text-anchor="middle" style="font-size:13px;fill:#363844">'+T.svg.gapLab+'</text></g>';
  }
  if(opts.cloud){
    /* to, co skaner już zarejestrował: siatka wyrostka oraz scanbody i piny, odsłaniane maską wzdłuż ścieżki */
    h+='<g mask="url(#mk'+k+')"><path d="'+cl.d+'" fill="none" stroke="url(#mesh'+k+')" stroke-width="77" stroke-linecap="round"/>';
    PINS.forEach(function(pn){var p=IMPL[pn.s],L=pn.len*MM;
      h+='<path transform="translate('+f1(p.x)+' '+f1(p.y)+') rotate('+f1(pn.a)+')" d="M'+f1(SBR+4)+' '+f1(-PW*.6)+'L'+f1(SBR+9)+' '+f1(-PW)+'H'+f1(SBR+L)+'V'+f1(PW)+'H'+f1(SBR+9)+'L'+f1(SBR+4)+' '+f1(PW*.6)+'Z" fill="#009F97" fill-opacity=".3" stroke="url(#'+g+')" stroke-width="2"/>';});
    IMPL.forEach(function(p){h+='<circle cx="'+f1(p.x)+'" cy="'+f1(p.y)+'" r="'+SBR+'" fill="#0085C1" fill-opacity=".38" stroke="url(#'+g+')" stroke-width="2.4"/>';});
    h+='</g>';
  }
  if(opts.cloud){
    var R=rnd(7),dots=[];
    var add=function(x,y,c,r){dots.push({x:x,y:y,c:c,r:r});};
    IMPL.forEach(function(p){for(var j=0;j<10;j++){var an=j*36*Math.PI/180;add(p.x+SBR*Math.cos(an),p.y+SBR*Math.sin(an),j%2?'#0085C1':'#009F97',2.2);}});
    PINS.forEach(function(pn){
      var p=IMPL[pn.s],L=pn.len*MM,s,y,v;
      for(s=SBR+10;s<=SBR+L;s+=7){v=rot(s,-PW,pn.a);add(p.x+v[0],p.y+v[1],'#0085C1',2);v=rot(s,PW,pn.a);add(p.x+v[0],p.y+v[1],'#0085C1',2);}
      for(y=-PW+3;y<PW;y+=5){v=rot(SBR+L,y,pn.a);add(p.x+v[0],p.y+v[1],'#009F97',2);}
    });
    var RG=rnd(5);for(var j2=0;j2<70;j2++){var pp=polar(215-250*RG(),RR+(RG()-.5)*66);add(pp[0],pp[1],'#9A9A9A',1.6);}
    h+='<g class="cloud">'+dots.map(function(d){return '<circle class="dot" data-kp="'+PATHS.p.nearest(d.x,d.y).toFixed(4)+'" cx="'+f1(d.x)+'" cy="'+f1(d.y)+'" r="'+d.r+'" fill="'+d.c+'"/>';}).join('')+'</g>';
    h+='<path class="trail" d="'+P0.d+'" fill="none" stroke="url(#'+g+')" stroke-width="2" stroke-opacity=".7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>';
  }
  if(opts.scan){
    h+='<g class="head" transform="'+headTf(P0,0)+'"><circle class="beam" r="34" fill="url(#beam'+k+')"/>'+scannerTop(g)+'</g>';
    /* licznik postępu skanu */
    h+='<g class="hud"><rect x="444" y="16" width="140" height="44" rx="6" fill="#060509"/>'+
       '<text x="456" y="35" style="font-size:11px;fill:#B9B9B9;letter-spacing:.6px">'+T.svg.hud+'</text>'+
       '<text class="hudn" x="572" y="36" text-anchor="end" style="font-size:15px;fill:#FFFEFE">0%</text>'+
       '<rect x="456" y="44" width="116" height="4" fill="#4B4B4B"/><rect class="hudb" x="456" y="44" width="0" height="4" fill="url(#'+g+')"/></g>';
  }
  if(k===5){h+='<text class="lab" x="300" y="430" text-anchor="middle">'+T.svg.pinsLab1+'</text><text class="lab" x="300" y="452" text-anchor="middle">'+T.svg.pinsLab2+'</text>';}
  if(k===6){h+='<text class="lab" x="300" y="430" text-anchor="middle">'+T.svg.scanLab1+'</text><text class="lab" x="300" y="452" text-anchor="middle">'+T.svg.scanLab2+'</text>';}
  return h+'</svg>';
}

/* Typy i długości PEEK Pins: 1 mm = 14 j. Długości 6 / 9 / 13 mm i typy A–E wg katalogu DAS; kształty uproszczone. */
function pinSide(x,y,L,type){
  var h='<rect x="'+(x-16)+'" y="'+(y-6)+'" width="13" height="12" fill="#B9B9B9"/>'+
        '<path d="M'+(x-13)+' '+(y-6)+'v12M'+(x-9)+' '+(y-6)+'v12M'+(x-5)+' '+(y-6)+'v12" stroke="#7A7A7A" stroke-width=".8"/>';
  h+='<path d="M'+(x-3)+' '+(y-9)+'L'+(x+6)+' '+(y-18)+'H'+(x+L)+'V'+(y+18)+'H'+(x+6)+'L'+(x-3)+' '+(y+9)+'Z" fill="#FAFAFA" stroke="#363844" stroke-width="1.3" stroke-linejoin="round"/>';
  if(type==='D'||type==='E'){h+='<rect x="'+(x+3)+'" y="'+(y-23)+'" width="7" height="46" rx="1.5" fill="#FAFAFA" stroke="#363844" stroke-width="1.3"/>';}
  var d='',i;
  if(type==='A'){d='M'+(x+8)+' '+(y-7)+'H'+(x+L-1)+'M'+(x+8)+' '+(y+7)+'H'+(x+L-1);}
  else if(type==='B'){for(i=x+16;i<x+L-3;i+=12)d+='M'+i+' '+(y-17)+'V'+(y+17);}
  else if(type==='C'){for(i=x+13;i<x+L-2;i+=6)d+='M'+i+' '+(y-17)+'V'+(y+17);}
  else if(type==='D'){for(i=x+44;i<x+L-6;i+=35)d+='M'+i+' '+(y-17)+'V'+(y+17);}
  else{for(i=x+44;i<x+L-6;i+=35)d+='M'+(i-5)+' '+(y-17)+'L'+(i+5)+' '+(y+17);}
  return h+'<path d="'+d+'" stroke="#9A9A9A" stroke-width="'+(type==='B'?1.8:1.1)+'" fill="none"/>';
}
function typesSVG(){
  var U=14,cols=[[6,96],[9,226],[13,392]],rows=['A','B','C','D','E'],h='<svg viewBox="0 0 600 480" class="types" aria-hidden="true">';
  h+='<g class="hd">';
  cols.forEach(function(c){var x0=c[1],x1=c[1]+c[0]*U;h+='<path d="M'+x0+' 66H'+x1+'M'+x0+' 60V72M'+x1+' 60V72" stroke="#363844" stroke-width="1.2" fill="none"/><text x="'+((x0+x1)/2)+'" y="52" text-anchor="middle" style="font-size:15px;fill:#363844">'+c[0]+' mm</text>';});
  h+='</g>';

}

/* Dopasowanie w CAD: widok z boku, 1 mm = 40 j., oś x = 250, platforma multi-unit y = 410.
   Marker 209_SC_R (biblioteka DAS R do Exocad): Ø 4,8 mm, widoczne pasy z = 2,52–4,55 mm i 6,80–7,00 mm.

  for(n=0;n<110;n++){dots+='<circle cx="'+f1(AX+98+R()*200)+'" cy="'+f1(zy(5.7)+(R()-.5)*112)+'" r="1.7" fill="#B9B9B9"/>';}

  var h='<svg viewBox="0 0 600 480" class="cad" aria-hidden="true"><defs>'+GRAD('cg')+'</defs>';
  h+='<path d="M'+(AX-96)+' '+zy(7)+'H'+(AX+96)+'V'+zy(2.5)+'L'+(AX+80)+' '+Z0+'H'+(AX-80)+'L'+(AX-96)+' '+zy(2.5)+'Z" fill="none" stroke="#B9B9B9" stroke-width="1.4" stroke-dasharray="5 4"/>';
  h+='<path d="M'+(AX+96)+' '+(zy(5.7)-56)+'H560M'+(AX+96)+' '+(zy(5.7)+56)+'H560" fill="none" stroke="#B9B9B9" stroke-width="1.2" stroke-dasharray="5 4"/>';
  h+='<g>'+dots+'</g>';
  h+='<g class="lib"><rect x="'+(AX-96)+'" y="'+zy(4.55)+'" width="192" height="'+f1((4.55-2.52)*U)+'" fill="#0085C1" fill-opacity=".1" stroke="url(#cg)" stroke-width="2.8"/>'+
     '<rect x="'+(AX-96)+'" y="'+zy(7)+'" width="192" height="'+(0.2*U)+'" fill="#0085C1" fill-opacity=".1" stroke="url(#cg)" stroke-width="2.8"/></g>';
  h+='<g class="zone"><rect x="'+(AX-92)+'" y="'+(zy(6.8)+5)+'" width="184" height="'+((6.8-4.55)*U-10)+'" fill="#fff" fill-opacity=".88" stroke="#363844" stroke-width="1" stroke-dasharray="5 4"/>'+
     '<text x="'+AX+'" y="'+(zy(5.7)-2)+'" text-anchor="middle" style="font-size:14px;fill:#363844">'+T.svg.zone1+'</text>'+
     '<text x="'+AX+'" y="'+(zy(5.7)+17)+'" text-anchor="middle" style="font-size:13px;fill:#6F6F6F">'+T.svg.zone2+'</text></g>';
  h+='<g class="dims">';
  [[7,-5],[6.8,13],[4.55,4],[2.52,4]].forEach(function(e){h+='<path d="M'+(AX-112)+' '+zy(e[0])+'H'+(AX-100)+'" stroke="#363844" stroke-width="1.2"/><text x="'+(AX-118)+'" y="'+f1(zy(e[0])+e[1])+'" text-anchor="end" style="font-size:13px;fill:#363844">'+num(e[0].toFixed(e[0]===7||e[0]===6.8?1:2))+' mm</text>';});
  h+='<path d="M'+(AX-96)+' 436H'+(AX+96)+'M'+(AX-96)+' 430V442M'+(AX+96)+' 430V442" stroke="#363844" stroke-width="1.2" fill="none"/><text x="'+AX+'" y="456" text-anchor="middle" style="font-size:14px;fill:#363844">Ø '+num('4.8')+' mm</text>';
  h+='<text x="456" y="'+(zy(5.7)-66)+'" text-anchor="middle" style="font-size:13px;fill:#6F6F6F">'+T.svg.cadPin+'</text>';
  h+='<text x="'+(AX+110)+'" y="'+(Z0-6)+'" style="font-size:12px;fill:#6F6F6F">'+T.svg.cadMu+'</text>';
  h+='</g><text x="300" y="476" text-anchor="middle" style="font-size:12.5px;fill:#6F6F6F">'+T.svg.cadNote+'</text>';
  return h+'</svg>';
}

/* ---------- nawigacja ---------- */
var chips=document.getElementById('chips'), pin=document.getElementById('pin'), bar=document.getElementById('bar');
var prev=document.getElementById('prev'), next=document.getElementById('next'), count=document.getElementById('count');
var autoBtn=document.getElementById('auto'), timer=document.getElementById('timer');
chips.innerHTML=STEPS.map(function(s,i){return '<button type="button" class="chip" data-i="'+i+'"><b>'+String(i).padStart(2,'0')+'</b>'+s.chip+'</button>';}).join('');
var chipEls=[].slice.call(chips.children);
var cur=-1, timers=[], raf=0, auto=false, autoTO=0, swapTO=0;
function pad(n){return String(n).padStart(2,'0');}

/* klatka animacji: requestAnimationFrame, a gdy przeglądarka go wstrzymuje, zapasowy timer */
var runId=0;
function tick(cb){
  var id=runId,fired=false;
  function f(){if(fired||id!==runId)return;fired=true;cb();}
  raf=requestAnimationFrame(f);
  timers.push(setTimeout(f,48));
}
function clearRun(){runId++;timers.forEach(clearTimeout);timers=[];if(raf)cancelAnimationFrame(raf);raf=0;}
function setPh(el,n){el.classList.add('ph'+n);el.setAttribute('data-ph',n);}
function resetScene(el){
  el.classList.add('reset');
  for(var i=1;i<=9;i++)el.classList.remove('ph'+i);
  el.removeAttribute('data-ph');
  [].forEach.call(el.querySelectorAll('.dot.on'),function(d){d.classList.remove('on');});
  var tr=el.querySelectorAll('.trail,.maskp');[].forEach.call(tr,function(p){p.style.strokeDashoffset=1;});
  var hd=el.querySelector('.head');if(hd){hd.setAttribute('transform',headTf(pathOf(el),0));}
  if(el._hud)el._hud(0);
  void el.offsetWidth;
  el.classList.remove('reset');
}
function pathOf(el){return PATHS[el.getAttribute('data-path')||'c'];}
function runScan(el,cfg,instant){
  var trail=el.querySelectorAll('.trail,.maskp'),head=el.querySelector('.head'),path=pathOf(el);
  var key='data-k'+(el.getAttribute('data-path')||'c');
  var dots=[].slice.call(el.querySelectorAll('.dot')),ptr=0;
  dots.forEach(function(d){d._k=+d.getAttribute(key);});
  dots.sort(function(a,b){return a._k-b._k;});
  /* ruch „z ręki”: łagodny start i stop, nierówna prędkość, drobne wolnozmienne odchylenia, korpus obraca się z opóźnieniem */
  var seed=el.getAttribute('data-i')*1.7, ang=null;
  function progress(p){
    var e=0.5-0.5*Math.cos(Math.PI*p);
    return Math.max(0,Math.min(1,e+0.014*Math.sin(2*Math.PI*2.5*e+seed)*Math.sin(Math.PI*e)));
  }
  function wobble(s){
    var env=Math.min(1,s*10,(1-s)*10);
    return [env*(3.0*Math.sin(s*23+seed)+1.4*Math.sin(s*61+2.1*seed)), env*(2.6*Math.sin(s*29+1.3+seed)+1.2*Math.sin(s*73+0.7*seed))];
  }
  function apply(p,live){
    var s=live?progress(p):p, pose=headPose(path,s), n=wobble(s);
    [].forEach.call(trail,function(t){t.style.strokeDashoffset=(1-s);});
    if(el._hud)el._hud(s);
    if(live&&ang!==null){ang+=(((pose.a-ang)%360+540)%360-180)*0.12;}else{ang=pose.a;}
    if(head)head.setAttribute('transform','translate('+f1(pose.x+n[0])+' '+f1(pose.y+n[1])+') rotate('+f1(ang)+')');
    while(ptr<dots.length&&dots[ptr]._k<=s+0.01){dots[ptr].classList.add('on');ptr++;}
  }
  function done(){setPh(el,1);if(head)head.style.opacity=.7;var lp=STEPS[+el.getAttribute('data-i')].loop;if(lp&&!instant&&!auto)timers.push(setTimeout(function(){if(!auto&&scenes[cur]===el)play(cur);},lp));}
  if(head)head.style.opacity=1;
  if(FRAME!==null){apply(progress(FRAME),false);return;}
  if(instant){apply(1,false);done();return;}
  var start=0;
  function frame(){
    var now=performance.now();
    if(!start)start=now;
    var p=Math.min(1,(now-start)/cfg.dur);
    apply(p,true);
    if(now-start<cfg.dur)tick(frame);else{done();}
  }
  timers.push(setTimeout(function(){tick(frame);},cfg.delay));
}
function play(i){
  clearRun();
  var el=scenes[i],st=STEPS[i];
  resetScene(el);
  if(RM){st.tl.forEach(function(t){setPh(el,t[1]);});if(st.scan)runScan(el,st.scan,true);return;}
  st.tl.forEach(function(t){timers.push(setTimeout(function(){setPh(el,t[1]);},t[0]));});
  if(st.scan)runScan(el,st.scan,false);
  else if(st.loop&&!auto)timers.push(setTimeout(function(){if(cur===i&&!auto)play(i);},st.loop));
}
function renderPanel(i){
  var s=STEPS[i];
  var html='<div class="pnum">'+pad(i)+'.</div><h2>'+s.title+'</h2><p class="lead">'+s.lead+'</p>'+(s.body===null?checklistHTML():s.body);
  clearTimeout(swapTO);
  if(RM||cur<0){pin.innerHTML=html;wireChecklist();return;}
  pin.classList.add('out');
  swapTO=setTimeout(function(){pin.innerHTML=html;wireChecklist();void pin.offsetWidth;pin.classList.remove('out');},220);
}
function updateRing(){
  var n=loadCk().length;
  var pr=stage.querySelector('.ring .pr');if(pr)pr.style.strokeDashoffset=1-n/CK_TOTAL;
  var t=document.getElementById('ringNum');if(t)t.textContent=n+'/'+CK_TOTAL;
  var c=document.getElementById('ckc');if(c)c.textContent=T.ui.checked.replace('{n}',n).replace('{t}',CK_TOTAL);
}
function wireChecklist(){
  var boxes=pin.querySelectorAll('.cl input');
  [].forEach.call(boxes,function(b){b.addEventListener('change',function(){
    var v=loadCk(),k=+b.getAttribute('data-k'),ix=v.indexOf(k);
    if(b.checked&&ix<0)v.push(k);if(!b.checked&&ix>-1)v.splice(ix,1);saveCk(v);updateRing();});});
  var r=document.getElementById('ckreset');
  if(r)r.addEventListener('click',function(){saveCk([]);[].forEach.call(boxes,function(b){b.checked=false;});updateRing();});
  updateRing();
}
function scrollChip(i,instant){
  var c=chipEls[i],l=c.offsetLeft-chips.offsetLeft,w=chips.clientWidth;
  var target=l-(w-c.offsetWidth)/2;
  if(RM||instant){chips.scrollLeft=target;return;}
  try{chips.scrollTo({left:target,behavior:'smooth'});}catch(e){chips.scrollLeft=target;}
}
function go(i){
  i=Math.max(0,Math.min(N-1,i));
  if(i===cur){return;}
  var first=cur<0;
  scenes.forEach(function(s,k){s.classList.toggle('active',k===i);});
  renderPanel(i);
  cur=i;
  play(i);
  chipEls.forEach(function(c,k){if(k===i)c.setAttribute('aria-current','step');else c.removeAttribute('aria-current');c.classList.toggle('done',k<i);});
  scrollChip(i,first);
  bar.style.width=(i/(N-1)*100)+'%';
  count.textContent=pad(i)+' / '+pad(N-1);
  prev.disabled=i===0;next.disabled=i===N-1;
  try{history.replaceState(null,'','#'+T.ui.hash+'-'+i);}catch(e){}
  if(auto)armAuto();
}
function armAuto(){
  clearTimeout(autoTO);
  timer.style.transition='none';timer.style.width='0';
  var d=STEPS[cur].dur;
  if(!auto||!d||cur>=N-1){if(cur>=N-1)setAuto(false);return;}
  void timer.offsetWidth;
  timer.style.transition='width '+d+'ms linear';timer.style.width='100%';
  autoTO=setTimeout(function(){go(cur+1);},d);
}
function setAuto(on){
  auto=on;autoBtn.setAttribute('aria-pressed',on?'true':'false');
  autoBtn.textContent=on?T.ui.pause:T.ui.auto;
  if(on){if(cur>=N-1)go(0);armAuto();}
  else{clearTimeout(autoTO);timer.style.transition='none';timer.style.width='0';}
}

prev.addEventListener('click',function(){go(cur-1);});
next.addEventListener('click',function(){go(cur+1);});
autoBtn.addEventListener('click',function(){setAuto(!auto);});
chips.addEventListener('click',function(e){var b=e.target.closest('.chip');if(b)go(+b.getAttribute('data-i'));});
document.getElementById('replay').addEventListener('click',function(){play(cur);if(auto)armAuto();});
document.addEventListener('keydown',function(e){
  var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'){go(cur+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault();}
  else if(e.key==='Home'){go(0);}
  else if(e.key==='End'){go(N-1);}
});
scenes[6].setAttribute('data-path','p');
document.addEventListener('visibilitychange',function(){if(document.hidden&&auto)setAuto(false);});

var m=new RegExp(T.ui.hash+'-(\\d+)').exec(location.hash);
